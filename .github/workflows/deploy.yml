name: Deploy Backend to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  APP_DIR: /var/www/backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate backend dependencies
        run: npm ci

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Server-only files are excluded so --delete never removes them.
      - name: Sync code to /var/www/backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "test -f '$APP_DIR/.env'" \
            || { echo "::error::$APP_DIR/.env is missing on the server"; exit 1; }

          rsync -az --delete --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='uploads/' \
            --exclude='logs/' \
            --exclude='backups/' \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      # Login shell so node, npm and pm2 are on PATH (including nvm installs).
      - name: Install dependencies and reload PM2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -lc "'
            set -e
            cd $APP_DIR
            npm ci --omit=dev --no-audit --no-fund
            pm2 reload all --update-env
            pm2 save
          '"
